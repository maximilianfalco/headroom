name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut, without the v (e.g. 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify, but publish nothing"
        type: boolean
        default: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    # Gated so only an approved run can reach the signing key. Needs the repo to be public,
    # required reviewers are not available on a free private plan.
    environment: release
    permissions:
      contents: write

    env:
      # Repo variables, not secrets. Both are visible in any signed copy via codesign -dvvv.
      # Kept out of the file so a fork does not inherit this project's identity.
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
      # The designated requirement pins to this leaf. If it changes, every existing user has to
      # re-approve their keychain and re-place their widgets, so the build stops instead.
      EXPECTED_LEAF: ${{ vars.EXPECTED_CERT_LEAF }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the build is configured
        run: |
          for name in BUNDLE_ID SIGNING_IDENTITY EXPECTED_LEAF; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set."
              echo "gh variable set $name --body '<value>'"
              exit 1
            fi
          done
          echo "Building $BUNDLE_ID, signed by $SIGNING_IDENTITY"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild test \
            -project Headroom.xcodeproj -scheme HeadroomTests \
            -destination 'platform=macOS' -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO

      - name: Coverage gate
        run: ./scripts/coverage.sh TestResults.xcresult

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Check the signing identity is the pinned one
        run: |
          LEAF=$(security find-identity -v -p codesigning \
                 | awk -v id="\"$SIGNING_IDENTITY\"" '$0 ~ id {print $2; exit}')
          if [ -z "$LEAF" ]; then
            echo "::error::Signing identity '$SIGNING_IDENTITY' not in the keychain."
            exit 1
          fi
          if [ "$LEAF" != "$EXPECTED_LEAF" ]; then
            echo "::error::Certificate leaf is $LEAF, expected $EXPECTED_LEAF."
            echo "Releasing with a different certificate makes every existing user re-approve"
            echo "their keychain and re-place their widgets. Update EXPECTED_LEAF only if that"
            echo "is genuinely intended."
            exit 1
          fi
          echo "Signing with $SIGNING_IDENTITY, leaf $LEAF"

      - name: Set the version
        run: |
          /usr/bin/sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${{ inputs.version }}\"/" project.yml
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Headroom.xcodeproj -scheme Headroom -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--keychain $HOME/Library/Keychains/build.keychain-db" \
            ENABLE_DEBUG_DYLIB=NO \
            build

      - name: Verify the built app
        run: |
          APP=build/Build/Products/Release/Headroom.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --requirements - "$APP" 2>&1 | grep -q "$EXPECTED_LEAF" \
            || { echo "::error::Built app is not pinned to the expected certificate."; exit 1; }

          BUILT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          [ "$BUILT" = "${{ inputs.version }}" ] \
            || { echo "::error::Built version $BUILT does not match ${{ inputs.version }}."; exit 1; }

          # Intel users cannot run an arm64 only build.
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Headroom")
          echo "Architectures: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::Not a universal binary ($ARCHS). Set ARCHS in project.yml."; exit 1 ;;
          esac

      - name: Package
        id: package
        run: |
          # ditto, never zip. A plain zip drops symlinks and the code signature.
          ditto -c -k --keepParent build/Build/Products/Release/Headroom.app Headroom.zip
          echo "sha256=$(shasum -a 256 Headroom.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          shasum -a 256 Headroom.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Headroom-${{ inputs.version }}
          path: Headroom.zip

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" Headroom.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Headroom v${{ inputs.version }}" \
            --target main --generate-notes

      - name: Update the Homebrew cask
        if: ${{ !inputs.dry_run }}
        env:
          # A token with contents:write on the tap. GITHUB_TOKEN cannot reach another repo.
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP: maximilianfalco/homebrew-tap
          CASK: Casks/headroom.rb
        run: |
          gh api "repos/$TAP/contents/$CASK" --jq '.content' | base64 --decode > cask.rb
          SHA=$(gh api "repos/$TAP/contents/$CASK" --jq '.sha')
          /usr/bin/sed -i '' \
            -e "s/version \".*\"/version \"${{ inputs.version }}\"/" \
            -e "s/sha256 \".*\"/sha256 \"${{ steps.package.outputs.sha256 }}\"/" cask.rb
          gh api -X PUT "repos/$TAP/contents/$CASK" \
            -f message="cask: headroom ${{ inputs.version }}" \
            -f content="$(base64 -i cask.rb)" -f sha="$SHA" --jq '.commit.html_url'

      - name: Summary
        run: |
          {
            echo "### Headroom v${{ inputs.version }}"
            echo ""
            echo "- sha256 \`${{ steps.package.outputs.sha256 }}\`"
            echo "- dry run: ${{ inputs.dry_run }}"
            echo ""
            echo '```sh'
            echo "brew install --cask maximilianfalco/tap/headroom"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
