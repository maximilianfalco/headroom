name: Headroom
options:
  bundleIdPrefix: ${BUNDLE_ID}
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Intel Macs cannot run an arm64 only build, and the release workflow refuses to publish one.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
    # Set your team here, or pick it in Xcode under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""

targets:
  Headroom:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Headroom
    dependencies:
      - target: HeadroomWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        CODE_SIGN_ENTITLEMENTS: Headroom/Headroom.entitlements
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Headroom/Info.plist
      properties:
        LSUIElement: true

  HeadroomWidget:
    type: app-extension
    platform: macOS
    sources:
      # The widget is sandboxed and only ever reads the snapshot, so it carries no
      # credential handling.
      - path: Shared
        excludes:
          - KeychainQuery.swift
          - TokenStore.swift
          - UsageFetcher.swift
          - LocalUsageReader.swift
          - ModelPricing.swift
      - path: HeadroomWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.Widget
        CODE_SIGN_ENTITLEMENTS: HeadroomWidget/HeadroomWidget.entitlements
    info:
      path: HeadroomWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  HeadroomTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles Shared/ directly rather than hosting the app, so the suite needs no
    # signing certificate and no running menu bar app.
    sources:
      - path: Shared
        excludes:
          - UsageViews.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Headroom:
    build:
      targets:
        Headroom: all
  HeadroomTests:
    build:
      targets:
        HeadroomTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - HeadroomTests
      targets:
        - HeadroomTests
